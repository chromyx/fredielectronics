# Builds the site on GitHub and publishes the finished app for the Namecheap hosting.
#
# Why: the Namecheap server can run the site but cannot build it (its glibc is too old for
# Next.js's compiler), and its firewall does not accept SSH from GitHub. So GitHub builds the
# app and attaches it to the "namecheap-build" release; the server fetches it by itself
# (site/deploy/namecheap/update.sh, run by cron every 5 minutes) and installs it.
#
# The published file is built from this public code with placeholder values only:
# no database, no photos, no passwords or secrets.
#
# Runs on every push to main that touches site/, or by hand (Actions -> Deploy to Namecheap -> Run).
name: Deploy to Namecheap

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/deploy-namecheap.yml']
  workflow_dispatch:

permissions:
  contents: write   # to update the namecheap-build release

concurrency:
  group: deploy-namecheap
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: site
    steps:
      - name: Get the code (without photos and archives)
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /site/
            !/site/media/
            /.github/

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build
        env:
          NEXT_STANDALONE: '1'
          NEXT_TELEMETRY_DISABLED: '1'
          SITE_URL: https://fredielectronics.com
          # placeholders for the build only; the real values are set on the server
          DATABASE_URL: file:/tmp/build.db
          PAYLOAD_SECRET: build-only
        run: npm run build

      - name: Package the app
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          rm -rf .next/standalone/.env* .next/standalone/media .next/standalone/data
          tar -czf "$RUNNER_TEMP/app.tar.gz" -C .next/standalone .
          cd "$RUNNER_TEMP"
          sha256sum app.tar.gz > app.tar.gz.sha256
          echo "$GITHUB_SHA" > build.txt
          echo "package: $(du -h app.tar.gz | cut -f1), commit $GITHUB_SHA"

      - name: Publish to the namecheap-build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          gh release view namecheap-build -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
            gh release create namecheap-build -R "$GITHUB_REPOSITORY" --prerelease \
              --title "Namecheap build (automatic)" \
              --notes "Built by the Deploy to Namecheap workflow. The server installs the newest build by itself. Do not edit."
          # build.txt last: the server only acts when it changes, so the app file is always ready first.
          gh release upload namecheap-build -R "$GITHUB_REPOSITORY" --clobber app.tar.gz app.tar.gz.sha256
          gh release upload namecheap-build -R "$GITHUB_REPOSITORY" --clobber build.txt
